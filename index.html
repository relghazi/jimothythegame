<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Jimothy: Rain City Rumble</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#status-start {
	position: absolute;
	bottom: calc(10% - 34px);
	width: 100%;
	text-align: center;
	color: #fff0cc;
	font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	opacity: 0;
	transition: opacity 0.6s;
	animation: jim-pulse 1.8s ease-in-out infinite;
}
@keyframes jim-pulse { 50% { color: #8a7d60; } }
		/* The version shows where the prompt will be while loading, then gives
		   way to it (owner 2026-11-06). */
		#status-version {
	position: absolute;
	bottom: calc(10% - 34px);
	width: 100%;
	text-align: center;
	color: #8a7d60;
	font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
	letter-spacing: 0.08em;
	transition: opacity 0.4s;
}
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>#status-progress{appearance:none;-webkit-appearance:none;height:6px;border:none;border-radius:3px;background:#1d1a14;accent-color:#f2c230;}#status-progress::-webkit-progress-bar{background:#1d1a14;border-radius:3px;}#status-progress::-webkit-progress-value{background:#f2c230;border-radius:3px;}#status-progress::-moz-progress-bar{background:#f2c230;border-radius:3px;}</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<div id="status-version">v0.9.30</div>
			<div id="status-start">Click or press any key or button to start</div>
		</div>

		<script>
			window.jimothyShell = true;
			// tools/export.sh writes the version in; without it (a dev export) show nothing.
			const versionTag = document.getElementById('status-version');
			if (versionTag.textContent.includes('__')) versionTag.textContent = '';
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":82455064,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			// Jimothy (owner 2026-11-05): the gauge stays where it is, full,
			// and the start prompt fades in under it; the first click or key
			// (which also reaches the game, unlocking its sound) fades the
			// loader away. No second screen.
			statusProgress.value = 1;
			statusProgress.max = 1;
			const prompt = document.getElementById('status-start');
			document.getElementById('status-version').style.opacity = '0';
			setTimeout(() => { prompt.style.opacity = '1'; }, 300);
			statusOverlay.style.pointerEvents = 'none';
			const go = () => {
				window.jimothyStart = null;
				window.removeEventListener('pointerdown', go, true);
				window.removeEventListener('keydown', go, true);
				statusOverlay.style.transition = 'opacity 0.5s';
				statusOverlay.style.opacity = '0';
				setTimeout(() => setStatusMode('hidden'), 520);
			};
			window.addEventListener('pointerdown', go, true);
			window.addEventListener('keydown', go, true);
			// A controller press is seen by the game, not the page: the game
			// calls this when it starts (ui/splash.gd), so the loader fades too.
			window.jimothyStart = go;
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
